version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Uncomment and add build args if you use VITE_* envs at build time
      # args:
      #   VITE_API_URL: ${VITE_API_URL}
    ports:
      - "8080:80"
    restart: unless-stopped
    # For pure static sites, runtime envs are not needed.
    # If you must inject runtime config, consider an init script approach.

